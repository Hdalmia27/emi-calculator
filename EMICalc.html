<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EMI & EDI Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --accent: #22c55e;
      --danger: #ef4444;
      --ring: #22c55e55;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem; background: linear-gradient(120deg,#0b1225,#111827);
      color: var(--text); font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
    }
    .container { max-width: 900px; margin: 0 auto; display: grid; gap: 1.25rem; }
    .card { background: var(--card); border-radius: 14px; padding: 1.25rem; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.4rem, 2.5vw, 2rem); }
    p.lead { margin: 0 0 1rem; color: var(--muted); }
    .grid { display: grid; gap: 1rem; }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    @media (max-width: 760px) { .grid.cols-2, .grid.cols-3 { grid-template-columns: 1fr; } }
    label { display: block; font-weight: 600; margin: 0 0 .35rem; }
    .field {
      display: flex; align-items: center; gap: .5rem; background: #0b1020; border: 1px solid #1f2937;
      border-radius: 10px; padding: .65rem .8rem; transition: border .2s, box-shadow .2s;
    }
    .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
    .prefix, .suffix { color: var(--muted); font-weight: 600; min-width: 1.5rem; text-align: center; }
    input[type="number"] {
      flex: 1; background: transparent; color: var(--text); border: 0; outline: none; font: inherit;
      appearance: textfield;
    }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .out {
      background: #0b1020; border: 1px dashed #334155; border-radius: 10px; padding: .8rem .9rem;
      display: grid; gap: .25rem;
    }
    .out .label { color: var(--muted); font-size: .9rem; }
    .out .value { font-size: 1.25rem; font-weight: 700; }
    .error { color: var(--danger); font-weight: 600; margin-top: .25rem; }
    .footer { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 1rem; }
    button {
      background: transparent; border: 1px solid #334155; color: #cbd5e1;
      padding: .55rem .8rem; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>EMI & EDI Calculator</h1>
      <p class="lead">Enter loan amount, annual interest rate, and tenor (years). Outputs update instantly.</p>
      <div class="grid cols-3">
        <div>
          <label for="amount">Loan Amount</label>
          <div class="field">
            <span class="prefix">₹</span>
            <input id="amount" type="number" min="0" step="1000" value="1000000" />
          </div>
          <div id="amountErr" class="error"></div>
        </div>
        <div>
          <label for="rate">Annual Interest Rate</label>
          <div class="field">
            <input id="rate" type="number" min="0" max="100" step="0.01" value="17" />
            <span class="suffix">%</span>
          </div>
          <div id="rateErr" class="error"></div>
        </div>
        <div>
          <label for="years">Tenor (in years)</label>
          <div class="field">
            <input id="years" type="number" min="0" step="0.25" value="15" />
          </div>
          <div id="yearsErr" class="error"></div>
        </div>
      </div>

      <div class="grid cols-2" style="margin-top:1rem">
        <div class="out">
          <div class="label">Tenor (in months)</div>
          <div class="value" id="months">—</div>
        </div>
        <div class="out">
          <div class="label">EMI (per month)</div>
          <div class="value" id="emi">—</div>
        </div>
      </div>
      <div class="grid cols-2" style="margin-top:.75rem">
        <div class="out">
          <div class="label">Tenor (in days)</div>
          <div class="value" id="days">—</div>
        </div>
        <div class="out">
          <div class="label">EDI (per day)</div>
          <div class="value" id="edi">—</div>
        </div>
      </div>

      <div style="margin-top:1rem; text-align:right;">
        <button id="reset">Reset</button>
      </div>
    </div>
    <div class="footer">Figures are estimates only.</div>
  </div>

  <script>
    const inr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });

    const amountEl = document.getElementById('amount');
    const rateEl   = document.getElementById('rate');
    const yearsEl  = document.getElementById('years');

    const monthsEl = document.getElementById('months');
    const emiEl    = document.getElementById('emi');
    const daysEl   = document.getElementById('days');
    const ediEl    = document.getElementById('edi');

    const errA = document.getElementById('amountErr');
    const errR = document.getElementById('rateErr');
    const errY = document.getElementById('yearsErr');

    const resetBtn = document.getElementById('reset');

    function safePow(base, exp) {
      const result = Math.pow(base, exp);
      return Number.isFinite(result) ? result : Infinity;
    }

    function amortizedPayment(P, i, n) {
      if (!Number.isFinite(P) || !Number.isFinite(i) || !Number.isFinite(n) || P <= 0 || n <= 0) return NaN;
      if (Math.abs(i) < 1e-12) return P / n;
      const pow = safePow(1 + i, n);
      if (!Number.isFinite(pow) || pow === 1) return NaN;
      return P * i * pow / (pow - 1);
    }

    function validate() {
      let ok = true;
      const P = parseFloat(amountEl.value);
      const r = parseFloat(rateEl.value);
      const y = parseFloat(yearsEl.value);

      errA.textContent = '';
      errR.textContent = '';
      errY.textContent = '';

      if (!Number.isFinite(P) || P <= 0) { errA.textContent = 'Enter a positive loan amount.'; ok = false; }
      if (!Number.isFinite(r) || r < 0 || r > 100) { errR.textContent = 'Enter a rate between 0 and 100%.'; ok = false; }
      if (!Number.isFinite(y) || y <= 0) { errY.textContent = 'Enter a positive tenor in years.'; ok = false; }

      return ok;
    }

    function compute() {
      if (!validate()) {
        monthsEl.textContent = '—';
        emiEl.textContent = '—';
        daysEl.textContent = '—';
        ediEl.textContent = '—';
        return;
      }

      const P = parseFloat(amountEl.value);
      const rAnnual = parseFloat(rateEl.value) / 100;
      const years = parseFloat(yearsEl.value);

      const nMonths = years * 12;
      const nDays   = years * 360;

      const iMonthly = rAnnual / 12;
      const iDaily   = rAnnual / 360;

      const emi = amortizedPayment(P, iMonthly, nMonths);
      const edi = amortizedPayment(P, iDaily, nDays);

      monthsEl.textContent = nMonths.toLocaleString('en-IN', {maximumFractionDigits:0});
      daysEl.textContent   = nDays.toLocaleString('en-IN', {maximumFractionDigits:0});
      emiEl.textContent    = Number.isFinite(emi) ? inr.format(Math.round(emi)) : '—';
      ediEl.textContent    = Number.isFinite(edi) ? inr.format(Math.round(edi)) : '—';
    }

    [amountEl, rateEl, yearsEl].forEach(el => {
      el.addEventListener('input', compute);
      el.addEventListener('change', compute);
    });

    resetBtn.addEventListener('click', () => {
      amountEl.value = '1000000';
      rateEl.value = '17';
      yearsEl.value = '15';
      compute();
    });

    compute();
  </script>
</body>
</html>
